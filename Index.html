<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <h1>MovieHub</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
            <a href="#series">Series</a>
        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="hero-content">
            <p class="small-title">WELCOME TO MOVIEHUB</p>

            <h2>Unlimited Movies & Series</h2>

            <p>
                Discover popular movies, exciting stories
                and your next favorite watch.
            </p>

            <button onclick="scrollToMovies()">
                Explore Movies
            </button>
        </div>
    </section>


    <!-- Search -->
    <section class="search-section">
        <input
            type="text"
            id="searchInput"
            placeholder="Search movies..."
        >
    </section>


    <!-- Movies -->
    <main id="movies">

        <div class="section-title">
            <h2>Popular Movies</h2>
            <p>Discover something new to watch</p>
        </div>

        <div id="movieContainer"></div>

    </main>


    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal">

        <div class="modal-content">

            <button id="closeModal" class="close-button">
                ×
            </button>

            <img
                id="modalImage"
                src=""
                alt="Movie Poster"
            >

            <div class="modal-info">

                <h2 id="modalTitle"></h2>

                <p id="modalInfo"></p>

                <p id="modalDescription"></p>

                <button id="watchButton" class="watch-button">
                    Watch Trailer
                </button>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        <p>© 2026 MovieHub. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
