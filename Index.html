<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineVerse</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="movieContainer"></div>

    <header class="navbar">
        <div class="logo">Cine<span>Verse</span></div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Series</a>
        </nav>
    </header>


    <main>

        <section class="hero">
            <div class="hero-content">
                <p class="tag">WELCOME TO CINEVERSE</p>

                <h1>Discover Your Next Favorite Movie</h1>

                <p>
                    Explore movies and TV series, ratings, genres,
                    trailers and more.
                </p>

                <button>Explore Now</button>
            </div>
        </section>


        <section class="section">
            <h2>🔥 Trending</h2>

            <div class="movie-grid">

                <div class="movie-card">
                    <div class="poster">MOVIE</div>
                    <h3>Movie Title</h3>
                    <p>⭐ 8.5</p>
                </div>

                <div class="movie-card">
                    <div class="poster">MOVIE</div>
                    <h3>Movie Title</h3>
                    <p>⭐ 8.2</p>
                </div>

                <div class="movie-card">
                    <div class="poster">SERIES</div>
                    <h3>Series Title</h3>
                    <p>⭐ 9.0</p>
                </div>

            </div>
        </section>

    </main>


    <footer>
        <p>© 2026 CineVerse</p>
    </footer>
    
<script src="script.js"></script>
</body>
</html>
